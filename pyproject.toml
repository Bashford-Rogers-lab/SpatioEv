[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatioev"
version = "0.1.0"
description = "Spatial feature extraction and spatial evolution framework for multiplexed imaging and spatial transcriptomics."
authors = [
    { name = "Shihong Wu" },
    { name = "Sakina Amin" },
    { name = "Liezel Tamon" },
    { name = "Rachael Bashford-Rogers" },
]
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.10"
keywords = [
    "spatial biology",
    "multiplexed imaging",
    "spatial transcriptomics",
    "single-cell analysis",
    "tissue microenvironment",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "anndata>=0.9",
    "matplotlib>=3.6",
    "networkx>=3.0",
    "numpy>=1.23",
    "pandas>=1.5",
    "scikit-image>=0.20",
    "scikit-learn>=1.3",
    "scipy>=1.9",
    "seaborn>=0.12",
    "shapely>=2.0",
    "statsmodels>=0.14",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "black>=24.0",
    "nbmake>=1.5",
    "nbformat>=5.9",
    "build>=1.2",
]
scanpy = [
    "scanpy>=1.10",
    "igraph>=0.10",
    "leidenalg>=0.10",
]
# Interactive Napari gating. This is the ONLY remaining scimap dependency:
# the two algorithmic functions SpatioEv uses (rescale, phenotype_cells) are
# vendored under spatioev/_vendor/scimap and need no scimap install.
# Installing this pulls scimap's own constraint set, including zarr==2.10.3.
gating = [
    "scimap[napari]>=2.3,<2.4",
    "setuptools>=68,<82",
]
# Backwards-compatible alias for the pre-0.2 name.
viewer = [
    "spatioev[gating]",
]
ui = [
    "dask[array]>=2024.1",
    "streamlit>=1.40",
    "tifffile>=2023.7",
    "zarr>=2.16,<3",
]
apps = [
    "spatioev[scanpy,ui]",
]
spatialdata = [
    "spatialdata>=0.2",
    "squidpy>=1.4",
]
trajectory = [
    "umap-learn>=0.5",
    "elpigraph-python>=0.3",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.24",
    "pymdown-extensions>=10.0",
]
all = [
    "spatioev[apps,dev,spatialdata,trajectory,docs]",
]

[project.scripts]
spatioev = "spatioev.cli:main"

[project.urls]
Homepage = "https://github.com/Bashford-Rogers-lab/SpatioEv"
Repository = "https://github.com/Bashford-Rogers-lab/SpatioEv"
Issues = "https://github.com/Bashford-Rogers-lab/SpatioEv/issues"

[tool.setuptools.packages.find]
include = ["spatioev*"]
exclude = [
    "tests*",
    "paper*",
    "tools*",
    "scripts*",
    "notebooks*",
    "tutorials*",
    "docs*",
    "data*",
    "results*",
]

[tool.setuptools.package-data]
"spatioev.resources" = ["*.csv"]
# MIT requires the copyright notice to ship with any redistribution.
"spatioev._vendor.scimap" = ["LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py310"
# Vendored third-party code is kept byte-identical to upstream where possible.
extend-exclude = ["spatioev/_vendor", "paper"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # line length; formatting is black's job
    # The rules below are deliberately not enforced: fixing them would change
    # runtime semantics in numerical code, which needs a scientific review
    # rather than an automated rewrite.
    "B905",  # zip() without strict=; adding it makes length mismatches raise
    "B007",  # unused loop control variable
    "E741",  # ambiguous variable name (l/I/O are conventional in this domain)
    "E731",  # lambda assignment
]

[tool.ruff.lint.per-file-ignores]
# Batch entry points and Streamlit pages must configure the environment
# (MPLCONFIGDIR, NUMBA_CACHE_DIR, matplotlib backend) before heavy imports.
"spatioev/workflows/*.py" = ["E402"]
"spatioev/apps/*.py" = ["E402"]
"spatioev/apps/pages/*.py" = ["E402"]
